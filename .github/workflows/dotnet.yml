name: Public Plugin

# https://github.com/softprops/action-gh-release/issues/236#issuecomment-1150530128
# 无需 Token 即可发布
permissions:
  contents: write

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  workflow_dispatch:
  release:
    types: [published]


jobs:
  build:
    runs-on: windows-latest # 添加EnableWindowsTargeting可支持跨平台编译WPF项目

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Bump plugin version
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $plugin = ".\STranslate.Plugin.Translate.HyMt\plugin.json"
          $project = ".\STranslate.Plugin.Translate.HyMt\STranslate.Plugin.Translate.HyMt.csproj"
          $data = Get-Content $plugin -Raw | ConvertFrom-Json
          if ($data.Version -notmatch '^(\d+)\.(\d+)(?:\.\d+)?$') { throw "Invalid plugin version: $($data.Version)" }
          $old = [decimal]::Parse("$($Matches[1]).$($Matches[2])", [Globalization.CultureInfo]::InvariantCulture)
          $newNumber = ($old + 0.01).ToString("0.00", [Globalization.CultureInfo]::InvariantCulture)
          $new = "$newNumber.0"
          $data.Version = $new
          $data | ConvertTo-Json -Depth 10 | Set-Content $plugin -Encoding utf8
          (Get-Content $project -Raw) -replace '<Version>[^<]+</Version>', "<Version>$new</Version>" | Set-Content $project -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $plugin $project
          git commit -m "chore: bump plugin version to $new [skip ci]"
          git push
          "PLUGIN_VERSION=$new" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        shell: pwsh
        run: |
          Write-Host "Repo name from github.event.repository.name: $env:REPO_NAME"
          dotnet build ".\$env:REPO_NAME\$env:REPO_NAME.csproj" --configuration Release --no-incremental --force

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: STranslate.Plugin.Translate.HyMt-${{ env.PLUGIN_VERSION || github.sha }}
          path: ./.artifacts/plugins/*.spkg
          if-no-files-found: error
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false # 设置为 false 可立即发布版本
          files: |
            ./.artifacts/plugins/*.spkg
