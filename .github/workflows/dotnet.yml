name: Public Plugin

# https://github.com/softprops/action-gh-release/issues/236#issuecomment-1150530128
# 无需 Token 即可发布
permissions:
  contents: write

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  release:
    types: [published]


jobs:
  build:
    runs-on: windows-latest # 添加EnableWindowsTargeting可支持跨平台编译WPF项目

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        shell: pwsh
        run: |
          Write-Host "Repo name from github.event.repository.name: $env:REPO_NAME"
          dotnet build ".\$env:REPO_NAME\$env:REPO_NAME.csproj" --configuration Release --no-incremental --force

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: STranslate.Plugin.Translate.HyMt-${{ github.sha }}
          path: ./.artifacts/plugins/*.spkg
          if-no-files-found: error
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false # 设置为 false 可立即发布版本
          files: |
            ./.artifacts/plugins/*.spkg
